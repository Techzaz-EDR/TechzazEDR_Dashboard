<div class="super-auth-container">
    <!-- SVG Background matched exactly to the image -->
    <svg class="circuit-bg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <!-- Edge horizontal connection lines -->
        <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none">
            <!-- Left edge lines connected to Top Left node -->
            <path d="M 0,33 L 20,33" />
            <path d="M 0,47 L 20,47" />
            <path d="M 0,61 L 20,61" />
            
            <path d="M 0,1019 L 20,1019" />
            <path d="M 0,1033 L 20,1033" />
            <path d="M 0,1047 L 20,1047" />
            
            <!-- Right edge lines -->
            <path d="M 1920,33 L 1900,33" />
            <path d="M 1920,47 L 1900,47" />
            <path d="M 1920,61 L 1900,61" />
            
            <path d="M 1920,1019 L 1900,1019" />
            <path d="M 1920,1033 L 1900,1033" />
            <path d="M 1920,1047 L 1900,1047" />
        </g>

        <!-- Connecting Lines to Center Auth Box (Orthogonal/45deg only) -->
        <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none">
            <!-- Top Left corner line -->
            <path d="M 140,47 L 320,47 L 400,127 L 400,300 L 770,300" />
            
            <!-- Top Right corner line -->
            <path d="M 1780,47 L 1600,47 L 1520,127 L 1520,300 L 1150,300" />
            
            <!-- Bottom Left corner line -->
            <path d="M 140,1033 L 320,1033 L 400,953 L 400,780 L 770,780" />
            
            <!-- Bottom Right corner line -->
            <path d="M 1780,1033 L 1600,1033 L 1520,953 L 1520,780 L 1150,780" />
        </g>

        <!-- The 4 Corner Nodes (Scaled up 33%) -->
        <!-- Top Left -->
        <g transform="translate(20, 20)">
            <rect x="0" y="0" width="120" height="54" rx="6" fill="#171717" stroke="#000000" stroke-width="2" />
            <rect x="2" y="2" width="116" height="50" rx="4" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.1" fill="none" />
            <g fill="#444">
                <circle cx="60" cy="13" r="1.3" />
                <circle cx="73" cy="13" r="1.3" />
                <circle cx="86" cy="13" r="1.3" />
                <circle cx="100" cy="13" r="1.3" />
                <circle cx="73" cy="24" r="2" fill="#aaa" />
                <circle cx="86" cy="24" r="1.3" />
                <circle cx="100" cy="24" r="2" fill="#aaa" />
                <circle cx="20" cy="37" r="1.3" />
                <circle cx="33" cy="37" r="1.3" />
                <circle cx="46" cy="37" r="2" fill="#aaa" />
                <circle cx="60" cy="37" r="1.3" />
                <circle cx="73" cy="37" r="1.3" />
                <circle cx="20" cy="45" r="1" />
            </g>
        </g>

        <!-- Top Right -->
        <g transform="translate(1780, 20)">
            <rect x="0" y="0" width="120" height="54" rx="6" fill="#171717" stroke="#000000" stroke-width="2" />
            <rect x="2" y="2" width="116" height="50" rx="4" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.1" fill="none" />
            <g fill="#444">
                <circle cx="60" cy="13" r="1.3" />
                <circle cx="73" cy="13" r="1.3" />
                <circle cx="86" cy="13" r="1.3" />
                <circle cx="100" cy="13" r="1.3" />
                <circle cx="73" cy="24" r="2" fill="#aaa" />
                <circle cx="86" cy="24" r="1.3" />
                <circle cx="100" cy="24" r="2" fill="#aaa" />
                <circle cx="20" cy="37" r="1.3" />
                <circle cx="33" cy="37" r="1.3" />
                <circle cx="46" cy="37" r="2" fill="#aaa" />
                <circle cx="60" cy="37" r="1.3" />
                <circle cx="73" cy="37" r="1.3" />
                <circle cx="20" cy="45" r="1" />
            </g>
        </g>

        <!-- Bottom Left -->
        <g transform="translate(20, 1006)">
            <rect x="0" y="0" width="120" height="54" rx="6" fill="#171717" stroke="#000000" stroke-width="2" />
            <rect x="2" y="2" width="116" height="50" rx="4" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.1" fill="none" />
            <g fill="#444">
                <circle cx="60" cy="13" r="1.3" />
                <circle cx="73" cy="13" r="1.3" />
                <circle cx="86" cy="13" r="1.3" />
                <circle cx="100" cy="13" r="1.3" />
                <circle cx="73" cy="24" r="2" fill="#aaa" />
                <circle cx="86" cy="24" r="1.3" />
                <circle cx="100" cy="24" r="2" fill="#aaa" />
                <circle cx="20" cy="37" r="1.3" />
                <circle cx="33" cy="37" r="1.3" />
                <circle cx="46" cy="37" r="2" fill="#aaa" />
                <circle cx="60" cy="37" r="1.3" />
                <circle cx="73" cy="37" r="1.3" />
                <circle cx="20" cy="45" r="1" />
            </g>
        </g>

        <!-- Bottom Right -->
        <g transform="translate(1780, 1006)">
            <rect x="0" y="0" width="120" height="54" rx="6" fill="#171717" stroke="#000000" stroke-width="2" />
            <rect x="2" y="2" width="116" height="50" rx="4" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.1" fill="none" />
            <g fill="#444">
                <circle cx="60" cy="13" r="1.3" />
                <circle cx="73" cy="13" r="1.3" />
                <circle cx="86" cy="13" r="1.3" />
                <circle cx="100" cy="13" r="1.3" />
                <circle cx="73" cy="24" r="2" fill="#aaa" />
                <circle cx="86" cy="24" r="1.3" />
                <circle cx="100" cy="24" r="2" fill="#aaa" />
                <circle cx="20" cy="37" r="1.3" />
                <circle cx="33" cy="37" r="1.3" />
                <circle cx="46" cy="37" r="2" fill="#aaa" />
                <circle cx="60" cy="37" r="1.3" />
                <circle cx="73" cy="37" r="1.3" />
                <circle cx="20" cy="45" r="1" />
            </g>
        </g>

        <!-- Small Highlighted Glowing Dots at Connection Points -->
        <g fill="#FFFFFF" filter="drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.95))">
            <circle cx="770" cy="300" r="3.5" />
            <circle cx="1150" cy="300" r="3.5" />
            <circle cx="770" cy="780" r="3.5" />
            <circle cx="1150" cy="780" r="3.5" />
        </g>
        
        <g fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2">
            <circle cx="770" cy="300" r="6" />
            <circle cx="1150" cy="300" r="6" />
            <circle cx="770" cy="780" r="6" />
            <circle cx="1150" cy="780" r="6" />
        </g>
    </svg>

    <div class="auth-card">
        <div class="logo-box-group">
            <div class="dots-left">
                <div class="dot-row">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="dot-row">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
            <div class="logo-box">
                <svg viewBox="0 0 24 24" fill="none" class="brand-icon">
                    <circle cx="12" cy="12" r="3" fill="#60a5fa" />
                    <path d="M10 5 C6 8 6 16 10 19" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round" />
                    <path d="M14 5 C18 8 18 16 14 19" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round" />
                </svg>
            </div>
            <div class="dots-right">
                <div class="dot-row">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="dot-row">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <div class="forms-slider" [class.show-signup]="isSignUpMode">
            <div class="form-panel">
                <h2 class="welcome-title">Welcome Back</h2>
                <p class="subtitle">Don't have an account yet? <a href="javascript:void(0)" class="signup-link"
                        (click)="toggleMode()">Sign up</a></p>

                <form (submit)="signIn()">
                    <div class="inputs-group">
                        <div class="input-field">
                            <lucide-icon name="mail" [size]="18" class="icon"></lucide-icon>
                            <input type="email" name="email" [(ngModel)]="email" placeholder="email address" required />
                        </div>
                        <div class="input-field">
                            <lucide-icon name="lock" [size]="18" class="icon"></lucide-icon>
                            <input type="password" name="password" [(ngModel)]="password" placeholder="Password"
                                required />
                        </div>
                    </div>

                    <button type="submit" class="btn-login">Login</button>
                    <div *ngIf="errorMessage && !isSignUpMode" class="error-banner">{{ errorMessage }}</div>


                </form>
            </div>

            <div class="form-panel">
                <h2 class="welcome-title">Create Account</h2>
                <p class="subtitle">Already have an account? <a href="javascript:void(0)" class="signup-link"
                        (click)="toggleMode()">Login</a></p>

                <form (submit)="signIn()">
                    <div class="inputs-group">
                        <div class="input-field">
                            <lucide-icon name="user" [size]="18" class="icon"></lucide-icon>
                            <input type="text" name="signupName" [(ngModel)]="signupName" placeholder="Username"
                                required />
                        </div>
                        <div class="input-field">
                            <lucide-icon name="mail" [size]="18" class="icon"></lucide-icon>
                            <input type="email" name="signupEmail" [(ngModel)]="signupEmail" placeholder="email address"
                                required />
                        </div>
                        <div class="input-field">
                            <lucide-icon name="lock" [size]="18" class="icon"></lucide-icon>
                            <input type="password" name="signupPassword" [(ngModel)]="signupPassword"
                                placeholder="Password" required />
                        </div>
                    </div>

                    <button type="submit" class="btn-login">Sign up</button>
                    <div *ngIf="errorMessage && isSignUpMode" class="error-banner">{{ errorMessage }}</div>
                </form>
            </div>
        </div>
    </div>
</div>
