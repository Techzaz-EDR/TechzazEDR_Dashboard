<div class="super-auth-container">
    <!-- SVG Background matched exactly to the image -->
    <svg class="circuit-bg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <!-- Connecting Lines -->
        <g stroke="#2a2a2a" stroke-width="1.5" fill="none">
            <!-- Top Left -->
            <path d="M 120,200 L 250,200 L 350,300 L 350,540 L 700,540" />

            <!-- Top Right -->
            <path d="M 1800,200 L 1670,200 L 1570,300 L 1570,540 L 1220,540" />

            <!-- Bottom Left -->
            <path d="M 120,880 L 250,880 L 350,780 L 350,540" />

            <!-- Bottom Right -->
            <path d="M 1800,880 L 1670,880 L 1570,780 L 1570,540" />
        </g>

        <!-- Right edge lines -->
        <g stroke="#333" stroke-width="1.5" fill="none">
            <path d="M 1920,180 L 1800,180" />
            <path d="M 1920,200 L 1800,200" />
            <path d="M 1920,220 L 1800,220" />

            <path d="M 1920,860 L 1800,860" />
            <path d="M 1920,880 L 1800,880" />
            <path d="M 1920,900 L 1800,900" />

            <path d="M 0,180 L 120,180" />
            <path d="M 0,200 L 120,200" />
            <path d="M 0,220 L 120,220" />

            <path d="M 0,860 L 120,860" />
            <path d="M 0,880 L 120,880" />
            <path d="M 0,900 L 120,900" />
        </g>

        <!-- Nodes Backgrounds -->
        <g fill="#171717" stroke="#000000" stroke-width="2">
            <!-- Top Left -->
            <rect x="25" y="180" width="90" height="40" rx="4" />
            <!-- Top Right -->
            <rect x="1805" y="180" width="90" height="40" rx="4" />
            <!-- Bottom Left -->
            <rect x="25" y="860" width="90" height="40" rx="4" />
            <!-- Bottom Right -->
            <rect x="1805" y="860" width="90" height="40" rx="4" />
        </g>

        <g stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.1" fill="none">
            <!-- Top Left inner border -->
            <rect x="26" y="181" width="88" height="38" rx="3" />
            <!-- Top Right inner border -->
            <rect x="1806" y="181" width="88" height="38" rx="3" />
            <!-- Bottom Left inner border -->
            <rect x="26" y="861" width="88" height="38" rx="3" />
            <!-- Bottom Right inner border -->
            <rect x="1806" y="861" width="88" height="38" rx="3" />
        </g>

        <!-- Complex dots pattern inside each node -->
        <g fill="#444">
            <!-- Top Left -->
            <!-- top row right aligned -->
            <circle cx="70" cy="190" r="1" />
            <circle cx="80" cy="190" r="1" />
            <circle cx="90" cy="190" r="1" />
            <circle cx="100" cy="190" r="1" />
            <!-- middle row right aligned -->
            <circle cx="80" cy="198" r="1.5" fill="#aaa" />
            <circle cx="90" cy="198" r="1" />
            <circle cx="100" cy="198" r="1.5" fill="#aaa" />
            <!-- bottom row full -->
            <circle cx="40" cy="208" r="1" />
            <circle cx="50" cy="208" r="1" />
            <circle cx="60" cy="208" r="1.5" fill="#aaa" />
            <circle cx="70" cy="208" r="1" />
            <circle cx="80" cy="208" r="1" />
            <circle cx="40" cy="214" r="0.8" />


            <!-- Top Right -->
            <circle cx="1850" cy="190" r="1" />
            <circle cx="1860" cy="190" r="1" />
            <circle cx="1870" cy="190" r="1" />
            <circle cx="1880" cy="190" r="1" />
            <circle cx="1860" cy="198" r="1.5" fill="#aaa" />
            <circle cx="1870" cy="198" r="1" />
            <circle cx="1880" cy="198" r="1.5" fill="#aaa" />
            <circle cx="1820" cy="208" r="1" />
            <circle cx="1830" cy="208" r="1" />
            <circle cx="1840" cy="208" r="1.5" fill="#aaa" />
            <circle cx="1850" cy="208" r="1" />
            <circle cx="1860" cy="208" r="1" />
            <circle cx="1820" cy="214" r="0.8" />

            <!-- Bottom Left -->
            <circle cx="70" cy="870" r="1" />
            <circle cx="80" cy="870" r="1" />
            <circle cx="90" cy="870" r="1" />
            <circle cx="100" cy="870" r="1" />
            <circle cx="80" cy="878" r="1.5" fill="#aaa" />
            <circle cx="90" cy="878" r="1" />
            <circle cx="100" cy="878" r="1.5" fill="#aaa" />
            <circle cx="40" cy="888" r="1" />
            <circle cx="50" cy="888" r="1" />
            <circle cx="60" cy="888" r="1.5" fill="#aaa" />
            <circle cx="70" cy="888" r="1" />
            <circle cx="80" cy="888" r="1" />
            <circle cx="40" cy="894" r="0.8" />

            <!-- Bottom Right -->
            <circle cx="1850" cy="870" r="1" />
            <circle cx="1860" cy="870" r="1" />
            <circle cx="1870" cy="870" r="1" />
            <circle cx="1880" cy="870" r="1" />
            <circle cx="1860" cy="878" r="1.5" fill="#aaa" />
            <circle cx="1870" cy="878" r="1" />
            <circle cx="1880" cy="878" r="1.5" fill="#aaa" />
            <circle cx="1820" cy="888" r="1" />
            <circle cx="1830" cy="888" r="1" />
            <circle cx="1840" cy="888" r="1.5" fill="#aaa" />
            <circle cx="1850" cy="888" r="1" />
            <circle cx="1860" cy="888" r="1" />
            <circle cx="1820" cy="894" r="0.8" />
        </g>

        <!-- Glow backing for light blocks -->
        <g fill="none" class="glow-squares">
            <rect x="146" y="196" width="8" height="8" rx="2" stroke="rgba(255,255,255,0.05)" stroke-width="8"
                fill="#111" />
            <rect x="1766" y="196" width="8" height="8" rx="2" stroke="rgba(255,255,255,0.05)" stroke-width="8"
                fill="#111" />
            <rect x="146" y="876" width="8" height="8" rx="2" stroke="rgba(255,255,255,0.05)" stroke-width="8"
                fill="#111" />
            <rect x="1766" y="876" width="8" height="8" rx="2" stroke="rgba(255,255,255,0.05)" stroke-width="8"
                fill="#111" />
        </g>

        <!-- White Connecting Squares -->
        <g fill="#FFFFFF" filter="drop-shadow(0px 0px 3px rgba(255,255,255,0.9))">
            <!-- White square block outside connecting lines -->
            <rect x="146" y="196" width="8" height="8" rx="2" />
            <rect x="1766" y="196" width="8" height="8" rx="2" />
            <rect x="146" y="876" width="8" height="8" rx="2" />
            <rect x="1766" y="876" width="8" height="8" rx="2" />
        </g>
    </svg>

    <div class="auth-card">
        <div class="logo-box-group">
            <div class="dots-left">
                <div class="dot-row">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="dot-row">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
            <div class="logo-box">
                <svg viewBox="0 0 24 24" fill="none" class="brand-icon" style="transform: scale(1.2)">
                    <!-- Central Blue Circle -->
                    <circle cx="12" cy="12" r="3.2" fill="#6ba0f3" />
                    <!-- Left Arc -->
                    <path d="M 10.5 6 A 6 6 0 0 0 10.5 18" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" fill="none" />
                    <!-- Right Arc -->
                    <path d="M 13.5 6 A 6 6 0 0 1 13.5 18" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" fill="none" />
                </svg>
            </div>
            <div class="dots-right">
                <div class="dot-row">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="dot-row">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <div class="forms-slider" [class.show-signup]="isSignUpMode">
            <div class="form-panel">
                <h2 class="welcome-title">Welcome Back</h2>
                <p class="subtitle">Don't have an account yet? <a href="javascript:void(0)" class="signup-link"
                        (click)="toggleMode()">Sign up</a></p>

                <form (submit)="signIn()">
                    <div class="inputs-group">
                        <div class="input-field">
                            <lucide-icon name="mail" [size]="18" class="icon"></lucide-icon>
                            <input type="email" name="email" [(ngModel)]="email" placeholder="email address" required />
                        </div>
                        <div class="input-field">
                            <lucide-icon name="lock" [size]="18" class="icon"></lucide-icon>
                            <input type="password" name="password" [(ngModel)]="password" placeholder="Password"
                                required />
                        </div>
                    </div>

                    <button type="submit" class="btn-login">Login</button>
                    <div *ngIf="errorMessage && !isSignUpMode" class="error-banner">{{ errorMessage }}</div>


                </form>
            </div>

            <div class="form-panel">
                <h2 class="welcome-title">Create Account</h2>
                <p class="subtitle">Already have an account? <a href="javascript:void(0)" class="signup-link"
                        (click)="toggleMode()">Login</a></p>

                <form (submit)="signIn()">
                    <div class="inputs-group">
                        <div class="input-field">
                            <lucide-icon name="user" [size]="18" class="icon"></lucide-icon>
                            <input type="text" name="signupName" [(ngModel)]="signupName" placeholder="Username"
                                required />
                        </div>
                        <div class="input-field">
                            <lucide-icon name="mail" [size]="18" class="icon"></lucide-icon>
                            <input type="email" name="signupEmail" [(ngModel)]="signupEmail" placeholder="email address"
                                required />
                        </div>
                        <div class="input-field">
                            <lucide-icon name="lock" [size]="18" class="icon"></lucide-icon>
                            <input type="password" name="signupPassword" [(ngModel)]="signupPassword"
                                placeholder="Password" required />
                        </div>
                    </div>

                    <button type="submit" class="btn-login">Sign up</button>
                    <div *ngIf="errorMessage && isSignUpMode" class="error-banner">{{ errorMessage }}</div>
                </form>
            </div>
        </div>
    </div>
</div>
