<div class="super-auth-container" [class.sign-up-mode]="isSignUpMode" (mousemove)="onMouseMove($event)"
    (mouseleave)="onMouseLeave()">
    <div class="hover-glow"></div>

    <!-- Background Data Fragments -->
    <div class="data-fragments">
        <div class="fragment" style="--top: 15%; --left: 10%; --delay: 0s">Techzaz EDR</div>
        <div class="fragment" style="--top: 25%; --left: 80%; --delay: 3s">Techzaz EDR</div>
        <div class="fragment" style="--top: 65%; --left: 15%; --delay: 6s">Techzaz EDR</div>
        <div class="fragment" style="--top: 80%; --left: 70%; --delay: 1.5s">Techzaz EDR</div>
    </div>

    <div class="auth-card">
        <!-- Sign In View -->
        <div class="auth-view sign-in-view">
            <form (submit)="signIn()">
                <div class="form-header">
                    <div class="status-line">
                        <span class="status-dot"></span>
                        <lucide-icon [name]="ShieldCheck" [size]="14"></lucide-icon>
                        Secure Console Access
                    </div>
                    <h2>Sign in to Techzaz EDR</h2>
                </div>

                <div *ngIf="errorMessage" class="error-banner">
                    {{ errorMessage }}
                </div>

                <div class="inputs-group">
                    <div class="form-group">
                        <div class="input-wrapper">
                            <lucide-icon [name]="User" [size]="20" class="input-icon"></lucide-icon>
                            <input type="email" name="email" [(ngModel)]="email" placeholder="Work Email" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-wrapper password-field">
                            <lucide-icon [name]="Lock" [size]="20" class="input-icon"></lucide-icon>
                            <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password"
                                placeholder="Password" required />
                            <button
                                type="button"
                                class="password-toggle"
                                (click)="togglePassword()"
                                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                                [attr.title]="showPassword ? 'Hide password' : 'Show password'"
                            >
                                <lucide-icon [name]="showPassword ? EyeOff : Eye" [size]="18" class="toggle-icon"></lucide-icon>
                            </button>
                        </div>
                    </div>
                </div>

                <a href="#" class="forgot-password">Forgot password?</a>
                <button type="submit" class="btn btn-primary full-width">Sign In</button>
                <p class="toggle-link">New here? <a (click)="toggleMode()">Create account</a></p>
            </form>
        </div>

        <!-- Sign Up View -->
        <div class="auth-view sign-up-view">
            <form>
                <div class="form-header">
                    <h2>Initialize Tenant</h2>
                </div>

                <div class="inputs-group">
                    <div class="form-group">
                        <div class="input-wrapper">
                            <lucide-icon [name]="User" [size]="20" class="input-icon"></lucide-icon>
                            <input type="text" name="signupName" [(ngModel)]="signupName"
                                placeholder="Administrator Name" />
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-wrapper">
                            <lucide-icon [name]="Mail" [size]="20" class="input-icon"></lucide-icon>
                            <input type="email" name="signupEmail" [(ngModel)]="signupEmail"
                                placeholder="Work Email" />
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="input-wrapper password-field">
                            <lucide-icon [name]="Lock" [size]="20" class="input-icon"></lucide-icon>
                            <input [type]="showSignupPassword ? 'text' : 'password'" name="signupPassword" [(ngModel)]="signupPassword"
                                placeholder="Master Password" />
                            <button
                                type="button"
                                class="password-toggle"
                                (click)="toggleSignupPassword()"
                                [attr.aria-label]="showSignupPassword ? 'Hide password' : 'Show password'"
                                [attr.title]="showSignupPassword ? 'Hide password' : 'Show password'"
                            >
                                <lucide-icon [name]="showSignupPassword ? EyeOff : Eye" [size]="18" class="toggle-icon"></lucide-icon>
                            </button>
                        </div>
                    </div>
                </div>

                <button type="button" class="btn btn-primary full-width" (click)="signIn()">Deploy Workspace</button>
                <p class="toggle-link">Already have an account? <a (click)="toggleMode()">Log In</a></p>
            </form>
        </div>
    </div>
</div>
