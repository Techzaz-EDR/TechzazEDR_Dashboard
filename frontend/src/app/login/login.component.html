<div class="super-auth-container">
    <!-- SVG Background matched exactly to the image -->
    <svg class="circuit-bg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <defs>
            <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#fff" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
        </defs>

        <!-- Underlaying straight horizontal lines (left) -->
        <g stroke="#2a2a2a" stroke-width="1.5">
            <line x1="0" y1="172" x2="120" y2="172" />
            <line x1="0" y1="182" x2="120" y2="182" />
            <line x1="0" y1="192" x2="120" y2="192" />
            
            <line x1="0" y1="872" x2="120" y2="872" />
            <line x1="0" y1="882" x2="120" y2="882" />
            <line x1="0" y1="892" x2="120" y2="892" />
        </g>

        <!-- Underlaying straight horizontal lines (right) -->
        <g stroke="#2a2a2a" stroke-width="1.5">
            <line x1="1800" y1="172" x2="1920" y2="172" />
            <line x1="1800" y1="182" x2="1920" y2="182" />
            <line x1="1800" y1="192" x2="1920" y2="192" />
            
            <line x1="1800" y1="872" x2="1920" y2="872" />
            <line x1="1800" y1="882" x2="1920" y2="882" />
            <line x1="1800" y1="892" x2="1920" y2="892" />
        </g>

        <!-- Glowing line trails entering right nodes -->
        <g stroke="url(#fadeRight)" stroke-width="1.5">
            <line x1="1800" y1="172" x2="1860" y2="172" />
            <line x1="1800" y1="182" x2="1860" y2="182" />
            <line x1="1800" y1="192" x2="1860" y2="192" />

            <line x1="1800" y1="872" x2="1860" y2="872" />
            <line x1="1800" y1="882" x2="1860" y2="882" />
            <line x1="1800" y1="892" x2="1860" y2="892" />
        </g>

        <!-- Glowing squares on the left middle lines -->
        <!-- Outer dark shell for the glowing square -->
        <g stroke="rgba(255,255,255,0.05)" stroke-width="2">
            <rect x="62" y="175" width="16" height="14" rx="4" fill="#111" />
            <rect x="62" y="875" width="16" height="14" rx="4" fill="#111" />
        </g>
        <!-- The bright glowing center -->
        <g fill="#ffffff" filter="url(#glow)">
            <rect x="66" y="179" width="8" height="6" rx="2" />
            <rect x="66" y="879" width="8" height="6" rx="2" />
        </g>

        <!-- Nodes Backgrounds -->
        <g fill="#171717" stroke="#000000" stroke-width="2">
            <rect x="120" y="153" width="90" height="56" rx="4" />
            <rect x="1710" y="153" width="90" height="56" rx="4" />
            <rect x="120" y="853" width="90" height="56" rx="4" />
            <rect x="1710" y="853" width="90" height="56" rx="4" />
        </g>
        
        <!-- Nodes subtle inner border highlight -->
        <g stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.1" fill="none">
            <rect x="121" y="154" width="88" height="54" rx="3" />
            <rect x="1711" y="154" width="88" height="54" rx="3" />
            <rect x="121" y="854" width="88" height="54" rx="3" />
            <rect x="1711" y="854" width="88" height="54" rx="3" />
        </g>

        <!-- Complex dots pattern inside each node correctly clustered to the sides -->
        <!-- Dots for Top Left (120, 153) -->
        <g fill="#444">
            <circle cx="165" cy="170" r="1"/> <circle cx="175" cy="170" r="1"/> <circle cx="185" cy="170" r="1"/> <circle cx="195" cy="170" r="1"/>
            <circle cx="175" cy="180" r="1.5" fill="#aaa"/> <circle cx="185" cy="180" r="1"/> <circle cx="195" cy="180" r="1.5" fill="#aaa"/>
            <circle cx="135" cy="190" r="1"/> <circle cx="145" cy="190" r="1"/> <circle cx="155" cy="190" r="1.5" fill="#aaa"/> <circle cx="165" cy="190" r="1"/> <circle cx="175" cy="190" r="1"/>
            <circle cx="135" cy="196" r="0.8"/>
        </g>
        
        <!-- Dots for Top Right (1710, 153) -->
        <g fill="#444">
            <circle cx="1725" cy="170" r="1"/> <circle cx="1735" cy="170" r="1"/> <circle cx="1745" cy="170" r="1"/> <circle cx="1755" cy="170" r="1"/>
            <circle cx="1725" cy="180" r="1.5" fill="#aaa"/> <circle cx="1735" cy="180" r="1"/> <circle cx="1745" cy="180" r="1.5" fill="#aaa"/>
            <circle cx="1745" cy="190" r="1"/> <circle cx="1755" cy="190" r="1"/> <circle cx="1765" cy="190" r="1.5" fill="#aaa"/> <circle cx="1775" cy="190" r="1"/> <circle cx="1785" cy="190" r="1"/>
            <circle cx="1785" cy="196" r="0.8"/>
        </g>
        
        <!-- Dots for Bottom Left (120, 853) -->
        <g fill="#444">
            <circle cx="165" cy="870" r="1"/> <circle cx="175" cy="870" r="1"/> <circle cx="185" cy="870" r="1"/> <circle cx="195" cy="870" r="1"/>
            <circle cx="175" cy="880" r="1.5" fill="#aaa"/> <circle cx="185" cy="880" r="1"/> <circle cx="195" cy="880" r="1.5" fill="#aaa"/>
            <circle cx="135" cy="890" r="1"/> <circle cx="145" cy="890" r="1"/> <circle cx="155" cy="890" r="1.5" fill="#aaa"/> <circle cx="165" cy="890" r="1"/> <circle cx="175" cy="890" r="1"/>
            <circle cx="135" cy="896" r="0.8"/>
        </g>
        
        <!-- Dots for Bottom Right (1710, 853) -->
        <g fill="#444">
            <circle cx="1725" cy="870" r="1"/> <circle cx="1735" cy="870" r="1"/> <circle cx="1745" cy="870" r="1"/> <circle cx="1755" cy="870" r="1"/>
            <circle cx="1725" cy="880" r="1.5" fill="#aaa"/> <circle cx="1735" cy="880" r="1"/> <circle cx="1745" cy="880" r="1.5" fill="#aaa"/>
            <circle cx="1745" cy="890" r="1"/> <circle cx="1755" cy="890" r="1"/> <circle cx="1765" cy="890" r="1.5" fill="#aaa"/> <circle cx="1775" cy="890" r="1"/> <circle cx="1785" cy="890" r="1"/>
            <circle cx="1785" cy="896" r="0.8"/>
        </g>
    </svg>

    <div class="auth-card">
        <div class="logo-box-group">
            <div class="dots-left">
                <div class="dot-row"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                <div class="dot-row"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            </div>
            <div class="logo-box">
                <svg viewBox="0 0 24 24" fill="none" class="brand-icon">
                    <circle cx="12" cy="12" r="3" fill="#60a5fa" />
                    <path d="M10 5 C6 8 6 16 10 19" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M14 5 C18 8 18 16 14 19" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="dots-right">
                <div class="dot-row"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                <div class="dot-row"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            </div>
        </div>

        <div class="forms-slider" [class.show-signup]="isSignUpMode">
            <div class="form-panel">
                <h2 class="welcome-title">Welcome Back</h2>
                <p class="subtitle">Don't have an account yet? <a href="javascript:void(0)" class="signup-link" (click)="toggleMode()">Sign up</a></p>

                <form (submit)="signIn()">
                    <div class="inputs-group">
                        <div class="input-field">
                            <lucide-icon name="mail" [size]="18" class="icon"></lucide-icon>
                            <input type="email" name="email" [(ngModel)]="email" placeholder="email address" required />
                        </div>
                        <div class="input-field">
                            <lucide-icon name="lock" [size]="18" class="icon"></lucide-icon>
                            <input type="password" name="password" [(ngModel)]="password" placeholder="Password" required />
                        </div>
                    </div>

                    <button type="submit" class="btn-login">Login</button>
                    <div *ngIf="errorMessage && !isSignUpMode" class="error-banner">{{ errorMessage }}</div>


                </form>
            </div>

            <div class="form-panel">
                <h2 class="welcome-title">Create Account</h2>
                <p class="subtitle">Already have an account? <a href="javascript:void(0)" class="signup-link" (click)="toggleMode()">Login</a></p>

                <form (submit)="signIn()">
                    <div class="inputs-group">
                        <div class="input-field">
                            <lucide-icon name="user" [size]="18" class="icon"></lucide-icon>
                            <input type="text" name="signupName" [(ngModel)]="signupName" placeholder="Username" required />
                        </div>
                        <div class="input-field">
                            <lucide-icon name="mail" [size]="18" class="icon"></lucide-icon>
                            <input type="email" name="signupEmail" [(ngModel)]="signupEmail" placeholder="email address" required />
                        </div>
                        <div class="input-field">
                            <lucide-icon name="lock" [size]="18" class="icon"></lucide-icon>
                            <input type="password" name="signupPassword" [(ngModel)]="signupPassword" placeholder="Password" required />
                        </div>
                    </div>

                    <button type="submit" class="btn-login">Sign up</button>
                    <div *ngIf="errorMessage && isSignUpMode" class="error-banner">{{ errorMessage }}</div>
                </form>
            </div>
        </div>
    </div>
</div>
