<div class="super-auth-container">
    <!-- SVG Background matched exactly to the image -->
    <svg class="circuit-bg" width="100%" height="100%" style="position:absolute; inset:0;">
        <!-- Connecting Lines to Center Auth Box (Orthogonal/45deg dynamic) -->
        <g stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none">
            <path [attr.d]="topLeftPath" />
            <path [attr.d]="topRightPath" />
            <path [attr.d]="bottomLeftPath" />
            <path [attr.d]="bottomRightPath" />
        </g>
        
        <!-- Animated Main Connections -->
        <g stroke="#ffffff" stroke-width="2" fill="none" filter="drop-shadow(0 0 5px #fff)">
            <path class="anim-conn" [attr.d]="topLeftPath" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
            <path class="anim-conn" [attr.d]="topRightPath" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
            <path class="anim-conn" [attr.d]="bottomLeftPath" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
            <path class="anim-conn" [attr.d]="bottomRightPath" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
        </g>

        <!-- Top Left Node -->
        <g transform="translate(20, 20)">
            <g stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none">
                <path d="M -20 13 L 0 13" />
                <path d="M -20 27 L 0 27" />
                <path d="M -20 41 L 0 41" />
            </g>
            <g stroke="#ffffff" stroke-width="2" fill="none" filter="drop-shadow(0 0 5px #fff)">
                <path d="M -20 13 L 0 13" class="anim-trim" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
                <path d="M -20 27 L 0 27" class="anim-trim" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
                <path d="M -20 41 L 0 41" class="anim-trim" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
            </g>
            <rect x="0" y="0" width="120" height="54" rx="6" fill="#171717" stroke="#000000" stroke-width="2" />
            <rect x="2" y="2" width="116" height="50" rx="4" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.1" fill="none" />
            <g fill="#444">
                <circle cx="60" cy="13" r="1.3" /> <circle cx="73" cy="13" r="1.3" /> <circle cx="86" cy="13" r="1.3" /> <circle cx="100" cy="13" r="1.3" />
                <circle cx="73" cy="24" r="2" fill="#aaa" /> <circle cx="86" cy="24" r="1.3" /> <circle cx="100" cy="24" r="2" fill="#aaa" />
                <circle cx="20" cy="37" r="1.3" /> <circle cx="33" cy="37" r="1.3" /> <circle cx="46" cy="37" r="2" fill="#aaa" /> <circle cx="60" cy="37" r="1.3" /> <circle cx="73" cy="37" r="1.3" />
                <circle cx="20" cy="45" r="1" />
            </g>
            <g fill="#fff" class="anim-node-dots-glow" style="opacity: 0" filter="drop-shadow(0 0 6px #ffffff)">
                <circle cx="60" cy="13" r="1.5" /> <circle cx="73" cy="13" r="1.5" /> <circle cx="86" cy="13" r="1.5" /> <circle cx="100" cy="13" r="1.5" />
                <circle cx="73" cy="24" r="2.2" /> <circle cx="86" cy="24" r="1.5" /> <circle cx="100" cy="24" r="2.2" />
                <circle cx="20" cy="37" r="1.5" /> <circle cx="33" cy="37" r="1.5" /> <circle cx="46" cy="37" r="2.2" /> <circle cx="60" cy="37" r="1.5" /> <circle cx="73" cy="37" r="1.5" />
                <circle cx="20" cy="45" r="1.5" />
            </g>
        </g>

        <!-- Top Right Node -->
        <g [attr.transform]="'translate(' + (screenWidth - 140) + ', 20)'">
            <g stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none">
                <path d="M 140 13 L 120 13" />
                <path d="M 140 27 L 120 27" />
                <path d="M 140 41 L 120 41" />
            </g>
            <g stroke="#ffffff" stroke-width="2" fill="none" filter="drop-shadow(0 0 5px #fff)">
                <path d="M 140 13 L 120 13" class="anim-trim" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
                <path d="M 140 27 L 120 27" class="anim-trim" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
                <path d="M 140 41 L 120 41" class="anim-trim" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
            </g>
            <rect x="0" y="0" width="120" height="54" rx="6" fill="#171717" stroke="#000000" stroke-width="2" />
            <rect x="2" y="2" width="116" height="50" rx="4" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.1" fill="none" />
            <g fill="#444">
                <circle cx="60" cy="13" r="1.3" /> <circle cx="73" cy="13" r="1.3" /> <circle cx="86" cy="13" r="1.3" /> <circle cx="100" cy="13" r="1.3" />
                <circle cx="73" cy="24" r="2" fill="#aaa" /> <circle cx="86" cy="24" r="1.3" /> <circle cx="100" cy="24" r="2" fill="#aaa" />
                <circle cx="20" cy="37" r="1.3" /> <circle cx="33" cy="37" r="1.3" /> <circle cx="46" cy="37" r="2" fill="#aaa" /> <circle cx="60" cy="37" r="1.3" /> <circle cx="73" cy="37" r="1.3" />
                <circle cx="20" cy="45" r="1" />
            </g>
            <g fill="#fff" class="anim-node-dots-glow" style="opacity: 0" filter="drop-shadow(0 0 6px #ffffff)">
                <circle cx="60" cy="13" r="1.5" /> <circle cx="73" cy="13" r="1.5" /> <circle cx="86" cy="13" r="1.5" /> <circle cx="100" cy="13" r="1.5" />
                <circle cx="73" cy="24" r="2.2" /> <circle cx="86" cy="24" r="1.5" /> <circle cx="100" cy="24" r="2.2" />
                <circle cx="20" cy="37" r="1.5" /> <circle cx="33" cy="37" r="1.5" /> <circle cx="46" cy="37" r="2.2" /> <circle cx="60" cy="37" r="1.5" /> <circle cx="73" cy="37" r="1.5" />
                <circle cx="20" cy="45" r="1.5" />
            </g>
        </g>

        <!-- Bottom Left Node -->
        <g [attr.transform]="'translate(20, ' + (screenHeight - 74) + ')'">
            <g stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none">
                <path d="M -20 13 L 0 13" />
                <path d="M -20 27 L 0 27" />
                <path d="M -20 41 L 0 41" />
            </g>
            <g stroke="#ffffff" stroke-width="2" fill="none" filter="drop-shadow(0 0 5px #fff)">
                <path d="M -20 13 L 0 13" class="anim-trim" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
                <path d="M -20 27 L 0 27" class="anim-trim" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
                <path d="M -20 41 L 0 41" class="anim-trim" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
            </g>
            <rect x="0" y="0" width="120" height="54" rx="6" fill="#171717" stroke="#000000" stroke-width="2" />
            <rect x="2" y="2" width="116" height="50" rx="4" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.1" fill="none" />
            <g fill="#444">
                <circle cx="60" cy="13" r="1.3" /> <circle cx="73" cy="13" r="1.3" /> <circle cx="86" cy="13" r="1.3" /> <circle cx="100" cy="13" r="1.3" />
                <circle cx="73" cy="24" r="2" fill="#aaa" /> <circle cx="86" cy="24" r="1.3" /> <circle cx="100" cy="24" r="2" fill="#aaa" />
                <circle cx="20" cy="37" r="1.3" /> <circle cx="33" cy="37" r="1.3" /> <circle cx="46" cy="37" r="2" fill="#aaa" /> <circle cx="60" cy="37" r="1.3" /> <circle cx="73" cy="37" r="1.3" />
                <circle cx="20" cy="45" r="1" />
            </g>
            <g fill="#fff" class="anim-node-dots-glow" style="opacity: 0" filter="drop-shadow(0 0 6px #ffffff)">
                <circle cx="60" cy="13" r="1.5" /> <circle cx="73" cy="13" r="1.5" /> <circle cx="86" cy="13" r="1.5" /> <circle cx="100" cy="13" r="1.5" />
                <circle cx="73" cy="24" r="2.2" /> <circle cx="86" cy="24" r="1.5" /> <circle cx="100" cy="24" r="2.2" />
                <circle cx="20" cy="37" r="1.5" /> <circle cx="33" cy="37" r="1.5" /> <circle cx="46" cy="37" r="2.2" /> <circle cx="60" cy="37" r="1.5" /> <circle cx="73" cy="37" r="1.5" />
                <circle cx="20" cy="45" r="1.5" />
            </g>
        </g>

        <!-- Bottom Right Node -->
        <g [attr.transform]="'translate(' + (screenWidth - 140) + ', ' + (screenHeight - 74) + ')'">
            <g stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none">
                <path d="M 140 13 L 120 13" />
                <path d="M 140 27 L 120 27" />
                <path d="M 140 41 L 120 41" />
            </g>
            <g stroke="#ffffff" stroke-width="2" fill="none" filter="drop-shadow(0 0 5px #fff)">
                <path d="M 140 13 L 120 13" class="anim-trim" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
                <path d="M 140 27 L 120 27" class="anim-trim" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
                <path d="M 140 41 L 120 41" class="anim-trim" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
            </g>
            <rect x="0" y="0" width="120" height="54" rx="6" fill="#171717" stroke="#000000" stroke-width="2" />
            <rect x="2" y="2" width="116" height="50" rx="4" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.1" fill="none" />
            <g fill="#444">
                <circle cx="60" cy="13" r="1.3" /> <circle cx="73" cy="13" r="1.3" /> <circle cx="86" cy="13" r="1.3" /> <circle cx="100" cy="13" r="1.3" />
                <circle cx="73" cy="24" r="2" fill="#aaa" /> <circle cx="86" cy="24" r="1.3" /> <circle cx="100" cy="24" r="2" fill="#aaa" />
                <circle cx="20" cy="37" r="1.3" /> <circle cx="33" cy="37" r="1.3" /> <circle cx="46" cy="37" r="2" fill="#aaa" /> <circle cx="60" cy="37" r="1.3" /> <circle cx="73" cy="37" r="1.3" />
                <circle cx="20" cy="45" r="1" />
            </g>
            <g fill="#fff" class="anim-node-dots-glow" style="opacity: 0" filter="drop-shadow(0 0 6px #ffffff)">
                <circle cx="60" cy="13" r="1.5" /> <circle cx="73" cy="13" r="1.5" /> <circle cx="86" cy="13" r="1.5" /> <circle cx="100" cy="13" r="1.5" />
                <circle cx="73" cy="24" r="2.2" /> <circle cx="86" cy="24" r="1.5" /> <circle cx="100" cy="24" r="2.2" />
                <circle cx="20" cy="37" r="1.5" /> <circle cx="33" cy="37" r="1.5" /> <circle cx="46" cy="37" r="2.2" /> <circle cx="60" cy="37" r="1.5" /> <circle cx="73" cy="37" r="1.5" />
                <circle cx="20" cy="45" r="1.5" />
            </g>
        </g>

        <!-- Small Highlighted Glowing Dots dynamically attached to exactly where the lines end -->
        <g fill="#FFFFFF" class="anim-card-dots" style="opacity: 0.2" filter="drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.95))">
            <circle [attr.cx]="dotTL.x" [attr.cy]="dotTL.y" r="3.5" />
            <circle [attr.cx]="dotTR.x" [attr.cy]="dotTR.y" r="3.5" />
            <circle [attr.cx]="dotBL.x" [attr.cy]="dotBL.y" r="3.5" />
            <circle [attr.cx]="dotBR.x" [attr.cy]="dotBR.y" r="3.5" />
        </g>
        
        <g fill="none" class="anim-card-dots" style="opacity: 0.1" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2">
            <circle [attr.cx]="dotTL.x" [attr.cy]="dotTL.y" r="6" />
            <circle [attr.cx]="dotTR.x" [attr.cy]="dotTR.y" r="6" />
            <circle [attr.cx]="dotBL.x" [attr.cy]="dotBL.y" r="6" />
            <circle [attr.cx]="dotBR.x" [attr.cy]="dotBR.y" r="6" />
        </g>
    </svg>

    <div class="auth-card">
        <svg class="card-border-svg" style="position: absolute; inset: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; border-radius: 16px;">
            <rect width="100%" height="100%" rx="16" fill="none" stroke="#fff" stroke-width="2" class="anim-card-border" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" filter="drop-shadow(0 0 8px rgba(255,255,255,0.8))" />
        </svg>
        <div class="logo-box-group">
            <div class="dots-left">
                <div class="dot-row">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="dot-row">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
            <div class="logo-box">
                <svg viewBox="0 0 24 24" fill="none" class="brand-icon">
                    <circle cx="12" cy="12" r="3" fill="#60a5fa" />
                    <path d="M10 5 C6 8 6 16 10 19" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round" />
                    <path d="M14 5 C18 8 18 16 14 19" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round" />
                </svg>
            </div>
            <div class="dots-right">
                <div class="dot-row">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="dot-row">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </div>

        <div class="forms-slider" [class.show-signup]="isSignUpMode">
            <div class="form-panel">
                <h2 class="welcome-title">Welcome Back</h2>
                <p class="subtitle">Don't have an account yet? <a href="javascript:void(0)" class="signup-link"
                        (click)="toggleMode()">Sign up</a></p>

                <form (submit)="signIn()">
                    <div class="inputs-group">
                        <div class="input-field">
                            <lucide-icon name="mail" [size]="18" class="icon"></lucide-icon>
                            <input type="email" name="email" [(ngModel)]="email" placeholder="email address" required />
                        </div>
                        <div class="input-field">
                            <lucide-icon name="lock" [size]="18" class="icon"></lucide-icon>
                            <input type="password" name="password" [(ngModel)]="password" placeholder="Password"
                                required />
                        </div>
                    </div>

                    <button type="submit" class="btn-login">Login</button>
                    <div *ngIf="errorMessage && !isSignUpMode" class="error-banner">{{ errorMessage }}</div>


                </form>
            </div>

            <div class="form-panel">
                <h2 class="welcome-title">Create Account</h2>
                <p class="subtitle">Already have an account? <a href="javascript:void(0)" class="signup-link"
                        (click)="toggleMode()">Login</a></p>

                <form (submit)="signIn()">
                    <div class="inputs-group">
                        <div class="input-field">
                            <lucide-icon name="user" [size]="18" class="icon"></lucide-icon>
                            <input type="text" name="signupName" [(ngModel)]="signupName" placeholder="Username"
                                required />
                        </div>
                        <div class="input-field">
                            <lucide-icon name="mail" [size]="18" class="icon"></lucide-icon>
                            <input type="email" name="signupEmail" [(ngModel)]="signupEmail" placeholder="email address"
                                required />
                        </div>
                        <div class="input-field">
                            <lucide-icon name="lock" [size]="18" class="icon"></lucide-icon>
                            <input type="password" name="signupPassword" [(ngModel)]="signupPassword"
                                placeholder="Password" required />
                        </div>
                    </div>

                    <button type="submit" class="btn-login">Sign up</button>
                    <div *ngIf="errorMessage && isSignUpMode" class="error-banner">{{ errorMessage }}</div>
                </form>
            </div>
        </div>
    </div>
</div>
