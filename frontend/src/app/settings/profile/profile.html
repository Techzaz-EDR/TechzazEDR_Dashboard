<div class="profile-container">
    <div class="profile-content">
        <!-- Profile Picture Section -->
        <section class="form-section">
            <h2>Profile Picture</h2>

            <div class="avatar-upload">
                <div class="avatar-circle">
                    <lucide-icon [name]="User" [size]="48" color="#1a1a1a"></lucide-icon>
                    <div class="camera-badge">
                        <lucide-icon [name]="Camera" [size]="14"></lucide-icon>
                    </div>
                </div>
                <div class="upload-actions">
                    <button class="btn-upload">
                        <lucide-icon [name]="Upload" [size]="16" class="icon-left"></lucide-icon>
                        Upload New Picture
                    </button>
                    <span class="upload-hint">JPG, PNG or GIF. Max size 5MB. Recommended 400x400px.</span>
                </div>
            </div>
        </section>

        <!-- Personal Information Section -->
        <section class="form-section">
            <h2>Personal Information</h2>
            <p class="section-desc">Update your personal details</p>

            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" [(ngModel)]="user.fullName">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" [(ngModel)]="user.email">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" [(ngModel)]="user.role">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" [(ngModel)]="user.phone">
                </div>
                <div class="form-group full-width">
                    <label>Bio</label>
                    <textarea rows="3" [(ngModel)]="user.bio"></textarea>
                </div>
            </div>
        </section>

        <!-- Company Information Section -->
        <section class="form-section">
            <h2>Company Information</h2>
            <p class="section-desc">Update your organization details</p>

            <div class="form-grid">
                <div class="form-group">
                    <label>Company Name</label>
                    <input type="text" [(ngModel)]="user.companyName">
                </div>
                <div class="form-group">
                    <label>Company Email</label>
                    <input type="email" [(ngModel)]="user.companyEmail">
                </div>
                <div class="form-group full-width">
                    <label>Company Address</label>
                    <input type="text" [(ngModel)]="user.companyAddress">
                </div>
            </div>
        </section>

        <div class="form-actions">
            <button class="btn-cancel">Cancel</button>
            <button class="btn-save" (click)="saveProfile()">Save Changes</button>
        </div>
    </div>
</div>
