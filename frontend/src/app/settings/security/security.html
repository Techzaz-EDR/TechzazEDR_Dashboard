<div class="settings-section">
    <div class="section-header">
        <h2>Security Settings</h2>
        <p>Configure security policies and protection</p>
    </div>

    <div class="settings-card-group">
        <div class="card-title">
            <h3>Security Policies</h3>
            <p>Manage your organization's security settings</p>
        </div>

        <div class="setting-item">
            <div class="setting-info">
                <h4>Require 2FA for all users</h4>
                <p>Enforce two-factor authentication</p>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting-item">
            <div class="setting-info">
                <h4>IP Whitelisting</h4>
                <p>Restrict access to specific IPs</p>
            </div>
            <label class="toggle-switch">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting-item">
            <div class="setting-info">
                <h4>Session Timeout</h4>
                <p>Auto-logout after 30 minutes</p>
            </div>
            <label class="toggle-switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>

    </div>
    <button class="btn-primary" style="margin-top: 2rem;" (click)="saveSettings()">Save Security Settings</button>
</div>
