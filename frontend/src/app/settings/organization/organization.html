<div class="settings-section">
    <div class="section-header">
        <h2>Organization Details</h2>
        <p>Update your organization's information</p>
    </div>

    <!-- Loading state -->
    <div class="loading-state" *ngIf="loading">
        <span>Loading organization details...</span>
    </div>

    <form class="settings-form" (submit)="saveChanges($event)" *ngIf="!loading">

        <div class="form-group">
            <label>Organization Name</label>
            <input type="text" [(ngModel)]="org.name" name="orgName"
                   placeholder="e.g. Techzaz Security">
        </div>

        <div class="form-group">
            <label>Organization Email</label>
            <input type="email" [(ngModel)]="org.email" name="orgEmail"
                   placeholder="e.g. admin@techzaz.com">
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" [(ngModel)]="org.phone" name="orgPhone"
                   placeholder="e.g. +94 11 234 5678">
        </div>

        <div class="form-group">
            <label>Website</label>
            <input type="url" [(ngModel)]="org.website" name="orgWebsite"
                   placeholder="e.g. https://techzaz.com">
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text" [(ngModel)]="org.address" name="orgAddress"
                   placeholder="e.g. 123 Tech Street, Colombo, Sri Lanka">
        </div>

        <!-- Feedback -->
        <div class="feedback feedback-success" *ngIf="saveSuccess">
            ✓ Organization details saved successfully!
        </div>
        <div class="feedback feedback-error" *ngIf="saveError">
            ✗ {{ saveError }}
        </div>

        <button type="submit" class="btn-primary" [disabled]="saving">
            <span *ngIf="saving">Saving...</span>
            <span *ngIf="!saving">Save Changes</span>
        </button>

    </form>
</div>
